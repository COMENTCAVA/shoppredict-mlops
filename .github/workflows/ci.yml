name: CI

on:
  pull_request:
    branches: [dev, staging, main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Lint
        run: ruff check .

      - name: Tests
        run: pytest -q || [ $? -eq 5 ]

      - name: Test model
        if: hashFiles('scripts/make_test_model.py') != ''
        run: python scripts/make_test_model.py

      - name: Docker build
        if: hashFiles('Dockerfile') != ''
        run: docker build -t shoppredict:ci .

      - name: Smoke test
        if: hashFiles('Dockerfile') != '' && hashFiles('scripts/smoke.sh') != ''
        run: |
          docker run -d --name app -p 8000:8000 -e MODEL_PATH=/model -v "$PWD/test_model:/model" shoppredict:ci
          bash scripts/smoke.sh http://localhost:8000 test

      - name: Container logs
        if: failure() && hashFiles('Dockerfile') != ''
        run: docker logs app || true
